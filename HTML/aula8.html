<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        #dois{padding:20px;border:1px solid #333;border-radius: 20px 10px;}
        h1{text-shadow:2px 2px #eb0606;}
        #caixa{
            width: 80px;
            height: 50px;
            border: 1px solid #333;
            position: fixed; left: 1%; top: 50%;
        }
        @keyframes anim{
            from{background-color: aqua;}
            to{background: url(HTML/coringa.jpg);}
        }
        div {
            width: 100px;
            height: 100px;
            background-color: red;
            animation-name: anim;
            animation-duration: 12s;
        }
    </style>
</head>
<body>
    <div id="dois"><p>Texto</p></div>
    <div id="caixa"><p>Textual</p></div>
    <div id="coringa"></div>
    <h1>Algo</h1>
    <div id="Algo"></div>
</body>
</html>
